<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E2740A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>Offline – Sri Charan Constructions</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#F3F5F9;color:#1B2433;text-align:center}
    .card{background:#fff;border:1px solid #E4E8EF;border-radius:16px;box-shadow:0 20px 50px rgba(16,24,40,.12);padding:34px 28px;max-width:380px;width:100%}
    img{width:84px;height:84px;margin-bottom:14px}
    h1{font-size:19px;color:#E2740A;letter-spacing:.4px;text-transform:uppercase;margin-bottom:18px}
    h2{font-size:18px;margin-bottom:8px}
    p{font-size:14px;line-height:1.55;color:#5B6779;margin-bottom:22px}
    button{width:100%;padding:13px 16px;border:0;border-radius:9px;font-size:15px;font-weight:700;color:#1B2433;cursor:pointer;
      background:linear-gradient(#F08A1E,#E2740A);box-shadow:0 5px 0 #B65A07}
    button:active{transform:translateY(3px);box-shadow:0 2px 0 #B65A07}
  </style>
</head>
<body>
  <div class="card">
    <img src="/img/logo.png" alt="">
    <h1>Sri Charan Constructions</h1>
    <h2>You're offline</h2>
    <p>The site log needs an internet connection to save and show your records. Check your mobile data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
