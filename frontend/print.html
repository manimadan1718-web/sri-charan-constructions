<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Print – Sri Charan Constructions</title>
  <meta name="description" content="Print view of a stored document for Sri Charan Constructions staff.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1B2433">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body>
  <noscript><p class="pv-msg">This page needs JavaScript. Please turn it on and open the print view again.</p></noscript>
  <header class="pv-bar">
    <div class="pv-title">
      <strong id="pv-name">Document</strong>
      <small id="pv-hint">Press Print, then choose the paper size, orientation and scale in the print window.</small>
    </div>
    <div class="pv-actions">
      <button type="button" class="pv-btn pv-primary" id="pv-print">Print</button>
      <button type="button" class="pv-btn" id="pv-close">Close</button>
    </div>
  </header>
  <p class="pv-msg" id="pv-msg" role="alert" hidden></p>
  <main class="pv-stage" id="pv-stage" aria-label="Document preview"></main>
  <script src="/js/print.js"></script>
</body>
</html>
